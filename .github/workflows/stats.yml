name: Update README stats

on:
  schedule:
    - cron: "17 0 * * *" # Daily at 09:17 KST.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-stats

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check stats token
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::Add a STATS_TOKEN repository secret with repo and read:user scopes."
            exit 1
          fi

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=transparent&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          core_version: 2.2.0
          fail_on_error: true

      - name: Generate languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          core_version: 2.2.0
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update README stats"
            git push
          fi
